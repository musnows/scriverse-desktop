name: Desktop checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Desktop repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve compatible Scriverse release
        id: scriverse-release
        run: |
          server_version="$(node --print "require('./package.json').scriverseServerVersion")"
          test -n "$server_version"
          echo "ref=v$server_version" >> "$GITHUB_OUTPUT"

      - name: Checkout compatible Scriverse runtime source
        uses: actions/checkout@v6
        with:
          repository: musnows/Scriverse
          ref: ${{ steps.scriverse-release.outputs.ref }}
          path: scriverse-runtime-source

      - name: Build compatible Scriverse runtime
        working-directory: scriverse-runtime-source
        run: |
          npm ci
          npm run build

      - name: Prepare compatible Desktop runtime
        env:
          SCRIVERSE_RUNTIME_DIR: ${{ github.workspace }}/scriverse-runtime-source/dist
        run: npm run runtime:prepare

      - name: Run Desktop checks
        run: npm run check
