name: Desktop checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Desktop repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Desktop checks
        run: npm run check
