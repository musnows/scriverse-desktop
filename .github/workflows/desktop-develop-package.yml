name: Package Desktop develop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-develop-package
  cancel-in-progress: true

jobs:
  test:
    name: Desktop develop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.develop.outputs.sha }}

    steps:
      - name: Checkout Desktop develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Record develop commit
        id: develop
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Desktop dependencies
        run: npm ci

      - name: Run Desktop checks
        run: npm run check

  package:
    name: Package develop ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            arch: arm64
          - label: macos-x64
            runner: macos-15-intel
            arch: x64
          - label: windows-x64
            runner: windows-2025
            arch: x64
          - label: windows-arm64
            runner: windows-11-vs2026-arm
            arch: arm64
          - label: linux-x64
            runner: ubuntu-24.04
            arch: x64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout Desktop develop
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Resolve compatible Scriverse release
        id: scriverse-release
        shell: bash
        run: |
          server_version="$(node --print "require('./package.json').scriverseServerVersion")"
          test -n "$server_version"
          echo "ref=v$server_version" >> "$GITHUB_OUTPUT"

      - name: Verify compatible Scriverse Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.scriverse-release.outputs.ref }}" --repo musnows/Scriverse

      - name: Checkout compatible Scriverse release
        uses: actions/checkout@v6
        with:
          repository: musnows/Scriverse
          ref: ${{ steps.scriverse-release.outputs.ref }}
          path: scriverse-runtime-source

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb

      - name: Build Scriverse runtime
        working-directory: scriverse-runtime-source
        run: |
          npm ci
          npm run build

      - name: Install Desktop dependencies
        run: npm ci

      - name: Package Desktop develop
        env:
          SCRIVERSE_RUNTIME_DIR: ${{ github.workspace }}/scriverse-runtime-source/dist
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Name macOS disk image by platform and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          dmg_path="$(find out/make -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mv "$dmg_path" "$(dirname "$dmg_path")/scriverse-desktop-macos-darwin-${{ matrix.arch }}-$package_version.dmg"

      - name: Name macOS ZIP by platform and architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          zip_path="$(find out/make/zip/darwin -name '*.zip' -print -quit)"
          test -n "$zip_path"
          mv "$zip_path" "$(dirname "$zip_path")/scriverse-desktop-macos-darwin-${{ matrix.arch }}-$package_version.zip"

      - name: Name Windows artifacts by platform and architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageVersion = node --print "require('./package.json').version"
          $squirrelDirectory = "out/make/squirrel.windows/${{ matrix.arch }}"
          $setup = Get-ChildItem -Path $squirrelDirectory -Filter "*Setup.exe" | Select-Object -First 1
          $nupkg = Get-ChildItem -Path $squirrelDirectory -Filter "*-full.nupkg" | Select-Object -First 1
          $releases = Join-Path $squirrelDirectory "RELEASES"
          if (-not $setup -or -not $nupkg -or -not (Test-Path $releases)) { throw "Missing Windows release artifacts" }
          Move-Item $setup.FullName (Join-Path $squirrelDirectory "scriverse-desktop-windows-win32-${{ matrix.arch }}-$packageVersion-Squirrel-Setup.exe")
          Move-Item $nupkg.FullName (Join-Path $squirrelDirectory "scriverse-desktop-windows-win32-${{ matrix.arch }}-$packageVersion-full.nupkg")
          Move-Item $releases (Join-Path $squirrelDirectory "scriverse-desktop-windows-win32-${{ matrix.arch }}-$packageVersion-RELEASES")

      - name: Verify packaged runtime
        if: runner.os != 'Linux'
        env:
          SCRIVERSE_DESKTOP_GATE_SKIP_LOCAL_SERVER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: npm run verify:package -- ${{ matrix.arch }}

      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        run: |
          package_dir="out/scriverse-desktop-linux-${{ matrix.arch }}"
          sudo chown root:root "$package_dir/chrome-sandbox"
          sudo chmod 4755 "$package_dir/chrome-sandbox"
          xvfb-run --auto-servernum npm run verify:package -- ${{ matrix.arch }}

      - name: Verify develop artifacts
        run: npm run verify:artifacts

      - name: Upload develop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scriverse-desktop-develop-${{ matrix.label }}
          path: |
            out/make/**
            !out/make/**/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish develop prerelease
    needs:
      - test
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout packaged develop commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.test.outputs.sha }}

      - name: Download develop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: scriverse-desktop-develop-*
          path: release-artifacts
          merge-multiple: false

      - name: Disambiguate Linux artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for artifact_dir in release-artifacts/scriverse-desktop-develop-linux-*; do
            label="${artifact_dir##*-develop-}"
            for file in "$artifact_dir"/*; do
              test -f "$file" || continue
              mv "$file" "$artifact_dir/${label}-$(basename "$file")"
            done
          done

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGED_SHA: ${{ needs.test.outputs.sha }}
        run: |
          version="$(node --print "require('./package.json').version")"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$PACKAGED_SHA"
          short="$(printf '%s' "$sha" | cut -c1-8)"
          tag="v${version}-beta.${short}"
          printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9a-f]{8}$'
          test "$tag" != "v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease tag already exists: $tag" >&2
            exit 1
          fi
          mapfile -d '' found < <(find release-artifacts -type f -print0)
          files=()
          for file in "${found[@]}"; do
            test -n "$file" && test -f "$file" && files+=("$file")
          done
          test "${#files[@]}" -gt 0
          names=()
          for file in "${files[@]}"; do
            names+=("$(basename "$file")")
          done
          duplicate="$(printf '%s\n' "${names[@]}" | sort | uniq -d)"
          test -z "$duplicate"
          dirs=(release-artifacts/scriverse-desktop-develop-*)
          test "${#dirs[@]}" -eq 6
          notes="$(cat <<EOF
          ### Scriverse Desktop ${tag}

          这是 Desktop develop 的预发布包，不是正式稳定版。应用版本号仍是 ${version}，兼容 Server v${version}。请不要把它当作 v${version} 稳定版。

          源提交：\`${sha}\`
          EOF
          )"
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --prerelease \
            --latest=false \
            --title "$tag" \
            --notes "$notes"
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          test "$latest" = "v${version}"
          published="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name,tagName,isPrerelease --jq '.name + " " + .tagName + " " + (.isPrerelease|tostring)')"
          test "$published" = "${tag} ${tag} true"
