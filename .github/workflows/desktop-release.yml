name: Publish Desktop release artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string
      scriverse_ref:
        description: Compatible Scriverse commit or tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  make:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            arch: arm64
          - label: macos-x64
            runner: macos-15-intel
            arch: x64
          - label: windows-x64
            runner: windows-2025
            arch: x64
          - label: linux-x64
            runner: ubuntu-24.04
            arch: x64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SCRIVERSE_RUNTIME_REF: ${{ inputs.scriverse_ref || vars.SCRIVERSE_RUNTIME_REF }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require a pinned Scriverse runtime ref
        shell: bash
        run: test -n "$SCRIVERSE_RUNTIME_REF"

      - name: Checkout compatible Scriverse runtime source
        uses: actions/checkout@v6
        with:
          repository: musnows/Scriverse
          ref: ${{ env.SCRIVERSE_RUNTIME_REF }}
          path: scriverse-runtime-source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb

      - name: Configure Windows self-signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "desktop-certificate.pfx"
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP "desktop-certificate.cer"
          $certificatePassword = [Guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $certificatePassword -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Scriverse Desktop" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(3)
          Export-PfxCertificate -Cert $certificate -FilePath $certificatePath -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath | Out-Null
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
          Write-Output "::add-mask::$certificatePassword"
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$certificatePassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Scriverse runtime
        working-directory: scriverse-runtime-source
        run: |
          npm ci
          npm run build

      - name: Install Desktop dependencies
        run: npm ci

      - name: Make Desktop artifacts
        env:
          SCRIVERSE_RUNTIME_DIR: ${{ github.workspace }}/scriverse-runtime-source/dist
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Verify packaged runtime
        if: runner.os != 'Linux'
        run: npm run verify:package -- ${{ matrix.arch }}

      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        run: |
          package_dir="out/Scriverse Desktop-linux-${{ matrix.arch }}"
          sudo chown root:root "$package_dir/chrome-sandbox"
          sudo chmod 4755 "$package_dir/chrome-sandbox"
          xvfb-run --auto-servernum npm run verify:package -- ${{ matrix.arch }}

      - name: Verify release artifacts
        run: npm run verify:artifacts

      - name: Verify macOS ad-hoc signature and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="out/scriverse-desktop-darwin-${{ matrix.arch }}/叙界.app"
          dmg_path="$(find out/make -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -F "Signature=adhoc"
          hdiutil verify "$dmg_path"

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "out/Scriverse Desktop-win32-${{ matrix.arch }}/Scriverse Desktop.exe",
            (Get-ChildItem -Path out/make -Recurse -Filter "*Setup.exe" | Select-Object -First 1 -ExpandProperty FullName)
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne "Valid" -or -not $signature.SignerCertificate) { throw "Invalid signature: $file" }
            if ($signature.SignerCertificate.Subject -ne "CN=Scriverse Desktop") { throw "Unexpected signer: $file" }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scriverse-desktop-release-${{ matrix.label }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach artifacts to GitHub Release
    needs: make
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: scriverse-desktop-release-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload artifacts to existing release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
