name: Publish Desktop release artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string
      scriverse_ref:
        description: Compatible Scriverse commit or tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  make:
    name: Sign and package ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-15
            arch: arm64
          - label: macos-x64
            runner: macos-15-intel
            arch: x64
          - label: windows-x64
            runner: windows-2025
            arch: x64
          - label: linux-x64
            runner: ubuntu-24.04
            arch: x64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SCRIVERSE_RUNTIME_REF: ${{ inputs.scriverse_ref || vars.SCRIVERSE_RUNTIME_REF }}
      SCRIVERSE_DESKTOP_RELEASE_BUILD: "true"
      APPLE_SIGN_IDENTITY: ${{ secrets.DESKTOP_APPLE_SIGN_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require a pinned Scriverse runtime ref
        shell: bash
        run: test -n "$SCRIVERSE_RUNTIME_REF"

      - name: Checkout compatible Scriverse runtime source
        uses: actions/checkout@v6
        with:
          repository: musnows/Scriverse
          ref: ${{ env.SCRIVERSE_RUNTIME_REF }}
          path: scriverse-runtime-source

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm xvfb

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.DESKTOP_APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_SIGN_IDENTITY"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          certificate_path="$RUNNER_TEMP/desktop-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          keychain_path="$RUNNER_TEMP/desktop-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          security create-keychain -p desktop-ci "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p desktop-ci "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k desktop-ci "$keychain_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { throw "Missing Windows signing certificate" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Missing Windows signing password" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "desktop-certificate.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Scriverse runtime
        working-directory: scriverse-runtime-source
        run: |
          npm ci
          npm run build

      - name: Install Desktop dependencies
        run: npm ci

      - name: Make signed Desktop artifacts
        env:
          SCRIVERSE_RUNTIME_DIR: ${{ github.workspace }}/scriverse-runtime-source/dist
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Verify packaged runtime
        if: runner.os != 'Linux'
        run: npm run verify:package -- ${{ matrix.arch }}

      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run verify:package -- ${{ matrix.arch }}

      - name: Verify release artifacts
        run: npm run verify:artifacts

      - name: Verify macOS Gatekeeper and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="out/叙界-darwin-${{ matrix.arch }}/叙界.app"
          dmg_path="$(find out/make -name '*.dmg' -print -quit)"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          hdiutil verify "$dmg_path"

      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "out/Scriverse Desktop-win32-${{ matrix.arch }}/Scriverse Desktop.exe",
            (Get-ChildItem -Path out/make -Recurse -Filter "*Setup.exe" | Select-Object -First 1 -ExpandProperty FullName)
          )
          foreach ($file in $files) {
            if ((Get-AuthenticodeSignature $file).Status -ne "Valid") { throw "Invalid signature: $file" }
          }

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scriverse-desktop-release-${{ matrix.label }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach artifacts to GitHub Release
    needs: make
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: scriverse-desktop-release-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload artifacts to existing release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
